[project]
name = "rare-disease-benchmark-schema"
version = "0.1.0"
description = "Shared types of the rare-disease case benchmark: the case record, case instances, and what a system under test receives."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = ["pydantic>=2.11"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rare_disease_benchmark.schema"
