# The cooldown mirrors `exclude-newer = "7 days"` in pyproject.toml. Dependabot does not read that setting, so without
# the cooldown it would open PRs for versions the in-repo age gate cannot lock.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
