# Workspace root: not a package. Each top-level folder (schema/, and later benchmark/, build/, ...) is its own
# distribution under the `rare_disease_benchmark` namespace, so a group can install only the parts it needs. This file
# holds the workspace, the shared dev tooling and its configuration.

[project]
name = "rare-disease-benchmark-workspace"
version = "0.0.0"
requires-python = ">=3.13"

[tool.uv]
package = false
# Supply-chain age gate: never resolve a release younger than 7 days. Declared in-repo so CI and contributors resolve
# the same lock; .github/dependabot.yml mirrors it with a matching cooldown.
exclude-newer = "7 days"

[tool.uv.workspace]
members = ["schema", "adapters/metamist"]

[tool.uv.sources]
rare-disease-benchmark-schema = { workspace = true }
rare-disease-benchmark-metamist = { workspace = true }

[dependency-groups]
# infra: the Pulumi program in infra/ (not a package; Pulumi runs it from this environment).
infra = ["pulumi", "pulumi-gcp", "pyyaml"]
test = ["pytest", "rare-disease-benchmark-schema", "rare-disease-benchmark-metamist", { include-group = "infra" }]
lint = ["pre-commit", "ruff", "pyright", "types-pyyaml", { include-group = "test" }]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    "A", "B", "C", "D", "E", "F", "G", "I", "N", "Q", "S", "W",
    "ANN", "ARG", "BLE", "COM", "DTZ", "ERA", "EXE", "ICN", "ISC",
    "PGH", "PIE", "PL", "PT", "PYI", "RET", "RSE", "RUF",
    "SIM", "SLF", "T10", "TID", "UP", "YTT",
]
fixable = ["ALL"]
ignore = [
    "COM812",  # Trailing comma prohibited
    # D1xx: docstring presence. Format is enforced when a docstring exists; presence is policy, not lint.
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "PLR0913", # Too many arguments in function definition
    "PLR2004", # Magic value used in comparison
    "Q000",    # Single quotes found but double quotes preferred
    "Q003",    # Change outer quotes (conflicts with single-quote formatter)
]

[tool.ruff.lint.per-file-ignores]
"*/tests/**" = [
    "S101",   # asserts are the standard pytest idiom
    "SLF001", # tests legitimately reach into module privates
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["rare_disease_benchmark", "rare_disease_infra"]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.pylint]
max-args = 10
max-branches = 20
max-returns = 10
max-statements = 80
max-locals = 25

[tool.pyright]
pythonVersion = "3.13"
include = ["schema", "infra", "adapters"]
# The Pulumi program imports its package from infra/, and the tests their helpers from the test folders.
extraPaths = ["infra", "infra/tests", "schema/tests"]
typeCheckingMode = "standard"
reportImplicitOverride = "error"

[tool.pytest.ini_options]
testpaths = ["schema/tests", "infra/tests", "adapters/metamist/tests"]
# Shared test helpers (schema/tests/edits.py, infra/tests/mocked_program.py) are imported by name, and the Pulumi
# program's package from infra/.
pythonpath = ["schema/tests", "infra/tests", "infra"]
# importlib: test modules in different folders may share a basename. strict-markers: a misspelled marker is a
# collection error rather than a warning, so it cannot silently deselect tests.
addopts = ["--import-mode=importlib", "--strict-markers"]
